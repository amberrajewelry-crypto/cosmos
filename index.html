<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COSMOS — космос внутри тебя</title>
    <style>
      :root {
        --ink: #e8e2cf;
        --gold: #bfa14a;
        --bg: #141033;
        --serif: Georgia, 'Times New Roman', serif;
        --mono: 'SF Mono', ui-monospace, Menlo, monospace;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--ink); }
      #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; }

      /* Онбординг «первые секунды» (§2.4) */
      #hero {
        position: fixed; left: 0; bottom: 0; z-index: 1;
        max-width: min(460px, 92vw); padding: 28px 26px;
      }
      #hero h1 { font-family: var(--mono); font-size: 22px; letter-spacing: 4px; margin: 0 0 8px; color: var(--gold); }
      #hero .thesis { font-family: var(--serif); font-size: 20px; line-height: 1.4; margin: 0 0 18px; }
      #reveal {
        font-family: var(--serif); font-size: 15px; color: var(--bg); background: var(--gold);
        border: none; padding: 11px 18px; border-radius: 2px; cursor: pointer;
      }
      #reveal:hover { filter: brightness(1.08); }
      #status { display: block; margin-top: 12px; font-family: var(--mono); font-size: 11px; opacity: .65; min-height: 14px; }
      .natal-open { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
      #birth { font-family: var(--mono); font-size: 12px; background: rgba(20,16,51,.6); color: var(--ink); border: 1px solid rgba(191,161,74,.5); padding: 6px 8px; border-radius: 2px; }
      #openNatal { font-family: var(--serif); font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--gold); padding: 7px 12px; border-radius: 2px; cursor: pointer; }
      #openNatal:hover { background: rgba(191,161,74,.12); }

      /* Второе лицо — карта рождения (§4.7) */
      #natal { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; background: rgba(10,8,26,.86); backdrop-filter: blur(2px); }
      .natal-box { position: relative; width: min(90vw, 520px); }
      .natal-svg { width: min(80vw, 460px); aspect-ratio: 1; margin: 0 auto; }
      .natal-close { position: absolute; top: -6px; right: 0; background: transparent; border: none; color: var(--ink); font-size: 20px; cursor: pointer; opacity: .7; }
      .natal-cap { font-family: var(--serif); font-size: 15px; line-height: 1.5; text-align: center; max-width: 460px; margin: 14px auto 12px; }
      .natal-rotate { display: block; margin: 0 auto; font-family: var(--serif); font-size: 15px; color: var(--bg); background: var(--gold); border: none; padding: 11px 18px; border-radius: 2px; cursor: pointer; }

      /* Панель карточек */
      #panel {
        position: fixed; top: 0; right: 0; z-index: 1;
        width: min(380px, 92vw); height: 100vh; box-sizing: border-box;
        padding: 24px 20px; overflow-y: auto;
        display: flex; flex-direction: column; gap: 14px;
      }
      .card { padding: 14px 16px; border-radius: 2px; background: rgba(20,16,51,.55); border: 1px solid rgba(191,161,74,.5); }
      .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      .num { font-family: var(--mono); font-size: 20px; color: var(--gold); letter-spacing: .5px; }
      .statement { font-family: var(--serif); font-size: 16px; line-height: 1.45; margin: 0 0 4px; }
      .tag { font-family: var(--mono); font-size: 11px; opacity: .7; }
      .tag-inline { margin-left: 4px; }
      .label { font-family: var(--serif); font-size: 15px; font-weight: 600; margin: 8px 0 6px; }
      .explain { font-family: var(--serif); font-size: 13px; line-height: 1.5; opacity: .9; margin: 0 0 8px; }
      .src { font-family: var(--mono); font-size: 10px; opacity: .5; }

      /* Фактура = честность (§4.4), кодируется фактурой, не цветом (§3.10) */
      .tag-ТОЧНО   { border-style: solid;  border-width: 1.5px; }
      .tag-ОЦЕНКА  { border-style: solid;  opacity: .92; box-shadow: inset 0 0 12px rgba(191,161,74,.08); }
      .tag-ГЛОБ    { border-style: solid;  background: transparent; }
      .tag-СПОРНО  { border-style: dashed; }
      .tag-МИФ     { border-style: solid;  border-color: rgba(255,255,255,.35); background: transparent; opacity: .7; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hero">
      <h1>C O S M O S</h1>
      <p class="thesis">Космос не вокруг тебя, а внутри тебя.</p>
      <button id="reveal">Показать, что происходит именно с тобой →</button>
      <div class="natal-open">
        <input type="date" id="birth" aria-label="Дата рождения" />
        <button id="openNatal">Карта рождения ○</button>
      </div>
      <span id="status"></span>
    </div>
    <div id="natal" hidden aria-label="Карта рождения"></div>
    <section id="panel" aria-label="Параметры космоса внутри тебя"></section>
    <script type="module" src="/src/ui/app.ts"></script>
  </body>
</html>
